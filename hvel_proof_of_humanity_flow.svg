<svg width="100%" viewBox="0 0 760 740" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>HVEL Proof of Humanity Flow</title>
  <desc>Architecture showing how HVEL Extension blocks Gmail and enforces Biometric + TOTP verification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Step 1: Gmail Blocker -->
  <g transform="translate(280, 20)" filter="url(#shadow)">
    <rect width="200" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="100" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1e293b">Compose Email</text>
    <text x="100" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#ef4444">Send Button Blocked 🔒</text>
  </g>
  <line x1="380" y1="80" x2="380" y2="110" marker-end="url(#arrow)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Step 2: Modal Appears -->
  <g transform="translate(260, 115)" filter="url(#shadow)">
    <rect width="240" height="65" rx="12" fill="url(#indigoGrad)" stroke="#4338ca" stroke-width="1"/>
    <text x="120" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">HVEL 2FA Modal</text>
    <text x="120" y="47" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#e0e7ff">Verification Required</text>
  </g>
  <line x1="380" y1="180" x2="380" y2="210" marker-end="url(#arrow)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Step 3: Biometric Step (WebAuthn) -->
  <g transform="translate(230, 215)" filter="url(#shadow)">
    <rect width="300" height="85" rx="15" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="150" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#6366f1" opacity="0.8">STEP 1: BIOMETRIC</text>
    <rect x="20" y="38" width="260" height="35" rx="8" fill="#f5f3ff"/>
    <text x="150" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#4338ca">Passkey / FaceID Check 👤</text>
  </g>
  <line x1="380" y1="300" x2="380" y2="330" marker-end="url(#arrow)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Step 4: TOTP Step -->
  <g transform="translate(230, 335)" filter="url(#shadow)">
    <rect width="300" height="85" rx="15" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="150" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#059669" opacity="0.8">STEP 2: TOTP CODE</text>
    <rect x="20" y="38" width="260" height="35" rx="8" fill="#ecfdf5"/>
    <text x="150" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#065f46">Enter 6-digit App Code ⌨️</text>
  </g>
  <line x1="380" y1="420" x2="380" y2="450" marker-end="url(#arrow)" stroke="#94a3b8" stroke-width="2"/>

  <!-- Step 5: Backend Validation -->
  <g transform="translate(260, 455)" filter="url(#shadow)">
    <rect width="240" height="70" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <text x="120" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Backend API</text>
    <text x="120" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Validates Secrets & Session</text>
  </g>

  <!-- Success Branch -->
  <line x1="500" y1="490" x2="570" y2="490" marker-end="url(#arrow)" stroke="#10b981" stroke-width="2"/>
  <text x="535" y="482" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#059669" font-weight="700">Verified</text>

  <!-- Step 6: Extension Action -->
  <g transform="translate(575, 455)" filter="url(#shadow)">
    <rect width="160" height="70" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="80" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#166534">Unblock Gmail</text>
    <text x="80" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#15803d">Send Button Enabled 🎉</text>
  </g>

  <!-- Step 7: Stamp & Trust -->
  <line x1="655" y1="525" x2="655" y2="570" marker-end="url(#arrow)" stroke="#94a3b8" stroke-width="2"/>
  <g transform="translate(530, 575)" filter="url(#shadow)">
    <rect width="210" height="65" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="105" y="27" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#0369a1">Trust Stamp Injection</text>
    <text x="105" y="47" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#0284c7">🧑 Human Verified (Badge + URL)</text>
  </g>

  <!-- Recipient Side -->
  <line x1="635" y1="640" x2="635" y2="675" marker-end="url(#arrow)" stroke="#94a3b8" stroke-width="2"/>
  <g transform="translate(530, 680)" filter="url(#shadow)">
    <rect width="210" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#334155">Recipient View</text>
    <text x="105" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Validates Proof via Trust Record</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 600)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#64748b">ARCHITECTURE LAYERS</text>
    <circle cx="10" cy="25" r="5" fill="#6366f1"/> <text x="25" y="29" font-family="'Inter', sans-serif" font-size="11" fill="#475569">HVEL Extension (UI/Logic)</text>
    <circle cx="10" cy="45" r="5" fill="#1e293b"/> <text x="25" y="49" font-family="'Inter', sans-serif" font-size="11" fill="#475569">HVEL Backend (API/DB)</text>
    <circle cx="10" cy="65" r="5" fill="#10b981"/> <text x="25" y="69" font-family="'Inter', sans-serif" font-size="11" fill="#475569">Success state</text>
  </g>

</svg>